<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>离线 - SimRyoko eSIM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f0f5ff; color: #2a3887;
      padding: 2rem; text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #666; margin-bottom: 1.5rem; }
    button {
      background: #4361ee; color: #fff; border: none;
      padding: 12px 32px; border-radius: 12px; font-size: 1rem;
      font-weight: 600; cursor: pointer; min-height: 44px;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>网络连接已断开</h1>
    <p>请检查网络后重试</p>
    <button onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
