version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: simryoko-db
    environment:
      POSTGRES_USER: simryoko
      POSTGRES_PASSWORD: simryoko123
      POSTGRES_DB: simryoko
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: simryoko-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: