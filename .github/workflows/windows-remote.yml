name: Windows Remote via Tailscale

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'PowerShell command'
        required: false
        default: 'whoami; hostname'

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo tailscale up \
            --authkey="tskey-auth-kxVBGHzSET11CNTRL-PAvYDbxC8BbbDLAALPo1BbTXPWEFBKKN" \
            --hostname="github-actions-runner" \
            --accept-routes
          sleep 8
          sudo tailscale status

      - name: Test connectivity
        run: |
          echo "Testing Windows machine at 100.77.140.53..."
          for i in {1..12}; do
            if ping -c 1 -W 3 100.77.140.53 > /dev/null 2>&1; then
              echo "✅ Reachable!"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 5
          done
          ping -c 2 100.77.140.53 || echo "Not reachable via ping, trying SSH anyway..."

      - name: SSH and run command
        env:
          CMD: ${{ github.event.inputs.command }}
        run: |
          sudo apt-get install -y sshpass -q

          # Try simryoko user first, then fallback to admin
          for USER in "simryoko" "administrator" "admin"; do
            echo "Trying user: $USER"
            OUTPUT=$(sshpass -p 'SimR@2026!kX' ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -o UserKnownHostsFile=/dev/null \
              "${USER}@100.77.140.53" \
              "powershell -Command \"$CMD\"" 2>&1)
            STATUS=$?
            if [ $STATUS -eq 0 ]; then
              echo "✅ Connected as $USER"
              break
            fi
          done

          echo "=== OUTPUT ==="
          echo "$OUTPUT"

          # Report to Telegram
          MSG="🖥️ Windows 远程执行结果

用户: $USER
命令: $CMD
状态: $([ $STATUS -eq 0 ] && echo '✅ 成功' || echo '❌ 失败')

输出:
$OUTPUT"
          curl -s -X POST "https://api.telegram.org/bot8719139746:AAGIambUViT-y948GjqlEbI8hh4A8g5aNv4/sendMessage" \
            -d "chat_id=7867683484" \
            --data-urlencode "text=$MSG"
