name: Remote Connect

on: [workflow_dispatch]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo apt-get install -y sshpass -q

      - name: Tailscale up
        run: |
          sudo tailscale up --authkey=tskey-auth-kxVBGHzSET11CNTRL-PAvYDbxC8BbbDLAALPo1BbTXPWEFBKKN --hostname=gha-runner --accept-routes
          sleep 10
          sudo tailscale status

      - name: SSH to Windows
        run: |
          RESULT=""
          for USER in simryoko administrator admin; do
            RESULT=$(sshpass -p 'SimR@2026!kX' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o UserKnownHostsFile=/dev/null $USER@100.77.140.53 'whoami & hostname' 2>&1) && break
          done
          echo "Result: $RESULT"
          curl -s -X POST https://api.telegram.org/bot8719139746:AAGIambUViT-y948GjqlEbI8hh4A8g5aNv4/sendMessage -d chat_id=7867683484 --data-urlencode "text=GHA Windows连接结果: $RESULT"
