<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 640px; height: 360px; overflow: hidden; font-family: -apple-system, 'Inter', 'SF Pro Display', sans-serif; }

  .card {
    width: 640px; height: 360px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  }

  /* 星空背景 */
  .stars { position: absolute; inset: 0; }
  .star { position: absolute; background: white; border-radius: 50%; }

  /* 地球光圈 */
  .globe-ring {
    position: absolute; right: -40px; top: 50%; transform: translateY(-50%);
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #667eea, #764ba2 60%, #1a0533);
    box-shadow: 0 0 80px rgba(102,126,234,0.5), inset 0 0 60px rgba(0,0,0,0.3);
  }
  .globe-ring::before {
    content: '';
    position: absolute; inset: 12px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.15);
  }
  .globe-ring::after {
    content: '';
    position: absolute; top: 50%; left: 0; right: 0; height: 1.5px;
    background: rgba(255,255,255,0.12);
  }
  /* 经纬线 */
  .lat1 { position: absolute; top: 30%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.08); }
  .lat2 { position: absolute; top: 70%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.08); }
  .lon1 { position: absolute; left: 30%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.08); }
  .lon2 { position: absolute; left: 70%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.08); }

  /* 信号弧线 */
  .arc {
    position: absolute; right: 80px; top: 50%; transform: translateY(-50%);
    border-radius: 50%; border: 2px solid rgba(102,126,234,0.4);
  }
  .arc1 { width: 380px; height: 380px; margin-top: -190px; margin-right: -190px; }
  .arc2 { width: 460px; height: 460px; margin-top: -230px; margin-right: -230px; border-color: rgba(102,126,234,0.2); }
  .arc3 { width: 550px; height: 550px; margin-top: -275px; margin-right: -275px; border-color: rgba(102,126,234,0.1); }

  /* 左侧内容 */
  .content { position: absolute; left: 0; top: 0; bottom: 0; width: 330px; display: flex; flex-direction: column; justify-content: center; padding: 0 44px; }

  /* 标签 */
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(102,126,234,0.25); border: 1px solid rgba(102,126,234,0.4);
    color: #a5b4fc; padding: 5px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
    margin-bottom: 18px; width: fit-content;
    text-transform: uppercase;
  }

  /* Logo 区 */
  .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .logo-icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; box-shadow: 0 4px 20px rgba(102,126,234,0.5);
    flex-shrink: 0;
  }
  .logo-text { color: white; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }

  /* 标语 */
  .tagline {
    color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6;
    margin-bottom: 28px;
  }
  .tagline strong { color: rgba(255,255,255,0.9); }

  /* 特性点 */
  .features { display: flex; flex-direction: column; gap: 8px; }
  .feat { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.8); font-size: 13px; }
  .feat-dot { width: 6px; height: 6px; border-radius: 50%; background: #667eea; flex-shrink: 0; }

  /* 价格 badge */
  .price-badge {
    position: absolute; right: 190px; bottom: 52px;
    background: linear-gradient(135deg, #f6d365, #fda085);
    color: white; padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 800;
    box-shadow: 0 4px 16px rgba(253,160,133,0.4);
  }

  /* 连接点 */
  .dot1 { position: absolute; right: 130px; top: 80px; width: 8px; height: 8px; border-radius: 50%; background: #a5b4fc; box-shadow: 0 0 12px #667eea; }
  .dot2 { position: absolute; right: 200px; top: 180px; width: 5px; height: 5px; border-radius: 50%; background: #c4b5fd; box-shadow: 0 0 8px #764ba2; }
  .dot3 { position: absolute; right: 160px; bottom: 90px; width: 6px; height: 6px; border-radius: 50%; background: #818cf8; box-shadow: 0 0 10px #6366f1; }

  /* 底部渐变 */
  .bottom-fade {
    position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(to top, rgba(0,0,0,0.3), transparent);
  }
</style>
</head>
<body>
<div class="card">
  <!-- 弧线 -->
  <div class="arc arc1"></div>
  <div class="arc arc2"></div>
  <div class="arc arc3"></div>

  <!-- 地球 -->
  <div class="globe-ring">
    <div class="lat1"></div>
    <div class="lat2"></div>
    <div class="lon1"></div>
    <div class="lon2"></div>
  </div>

  <!-- 光点 -->
  <div class="dot1"></div>
  <div class="dot2"></div>
  <div class="dot3"></div>

  <!-- 内容 -->
  <div class="content">
    <div class="tag">✦ eSIM · 200+ Countries</div>
    <div class="logo-row">
      <div class="logo-icon">📡</div>
      <div class="logo-text">SimKaze</div>
    </div>
    <div class="tagline">
      <strong>Global eSIM for travelers.</strong><br>
      Instant delivery · No physical SIM<br>
      Works on all eSIM phones
    </div>
    <div class="features">
      <div class="feat"><div class="feat-dot"></div>Japan · Korea · Europe · 200+ countries</div>
      <div class="feat"><div class="feat-dot"></div>Pay with TON · USDT · Card</div>
      <div class="feat"><div class="feat-dot"></div>eSIM delivered in seconds</div>
    </div>
  </div>

  <!-- 价格 -->
  <div class="price-badge">From $2.00</div>

  <div class="bottom-fade"></div>
</div>
</body>
</html>
