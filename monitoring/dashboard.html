<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimRyoko 监控中心</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
    }
    .header {
      background: rgba(0,0,0,0.3);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 { font-size: 24px; font-weight: 600; }
    .header .status { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .status-dot.healthy { background: #4ade80; }
    .status-dot.degraded { background: #fbbf24; }
    .status-dot.unhealthy { background: #f87171; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .container { padding: 24px 40px; }
    
    /* 健康度卡片 */
    .health-card {
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      margin-bottom: 24px;
    }
    .health-score {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
    }
    .health-score.healthy { color: #4ade80; }
    .health-score.degraded { color: #fbbf24; }
    .health-score.unhealthy { color: #f87171; }
    .health-label {
      font-size: 18px;
      opacity: 0.8;
      margin-top: 8px;
    }
    
    /* 指标网格 */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .metric-card {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
    }
    .metric-card h3 {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .metric-value {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .metric-sub { font-size: 13px; opacity: 0.6; }
    
    /* 告警区域 */
    .alerts-section {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .alerts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .alerts-header h2 { font-size: 18px; }
    .alert-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .alert-badge.critical { background: #dc2626; }
    .alert-badge.error { background: #ea580c; }
    .alert-badge.warning { background: #ca8a04; }
    
    .alert-list { max-height: 300px; overflow-y: auto; }
    .alert-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .alert-icon { font-size: 20px; }
    .alert-info { flex: 1; }
    .alert-title { font-weight: 500; margin-bottom: 4px; }
    .alert-message { font-size: 13px; opacity: 0.7; }
    .alert-time { font-size: 12px; opacity: 0.5; }
    
    /* 图表区域 */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .chart-card {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
    }
    .chart-card h3 {
      font-size: 16px;
      margin-bottom: 16px;
    }
    
    /* 端点表格 */
    .endpoints-table {
      width: 100%;
      border-collapse: collapse;
    }
    .endpoints-table th, .endpoints-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .endpoints-table th {
      font-size: 12px;
      opacity: 0.6;
      font-weight: 500;
      text-transform: uppercase;
    }
    .error-rate { color: #f87171; }
    
    /* 刷新按钮 */
    .refresh-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.3); }
    
    .last-update {
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 SimRyoko 监控中心</h1>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">运行中</span>
    </div>
  </div>
  
  <div class="container">
    <!-- 健康度 -->
    <div class="health-card">
      <div class="health-score" id="healthScore">100</div>
      <div class="health-label" id="healthLabel">系统健康</div>
    </div>
    
    <!-- 核心指标 -->
    <div class="metrics-grid">
      <div class="metric-card">
        <h3>📈 请求量 (RPS)</h3>
        <div class="metric-value" id="rps">0</div>
        <div class="metric-sub">每秒钟请求数</div>
      </div>
      <div class="metric-card">
        <h3>⚡ 平均响应</h3>
        <div class="metric-value" id="avgResponse">0ms</div>
        <div class="metric-sub">P95: <span id="p95Response">0ms</span></div>
      </div>
      <div class="metric-card">
        <h3>✅ 成功率</h3>
        <div class="metric-value" id="successRate">100%</div>
        <div class="metric-sub">错误率: <span id="errorRate">0%</span></div>
      </div>
      <div class="metric-card">
        <h3>🖥️ 资源使用</h3>
        <div class="metric-value" id="cpuUsage">0%</div>
        <div class="metric-sub">内存: <span id="memUsage">0%</span></div>
      </div>
    </div>
    
    <!-- 告警 -->
    <div class="alerts-section">
      <div class="alerts-header">
        <h2>🔔 活跃告警</h2>
        <button class="refresh-btn" onclick="refreshData()">刷新</button>
      </div>
      <div class="alert-list" id="alertList">
        <div style="opacity: 0.5; text-align: center; padding: 40px;">
          暂无活跃告警
        </div>
      </div>
    </div>
    
    <!-- 图表 -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>响应时间趋势</h3>
        <canvas id="responseChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>请求量趋势</h3>
        <canvas id="requestsChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/monitoring';
    let responseChart, requestsChart;
    let historyData = { labels: [], responseTime: [], requests: [] };
    
    // 初始化图表
    function initCharts() {
      const ctx1 = document.getElementById('responseChart').getContext('2d');
      const ctx2 = document.getElementById('requestsChart').getContext('2d');
      
      responseChart = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: '响应时间 (ms)',
            data: [],
            borderColor: '#4ade80',
            backgroundColor: 'rgba(74, 222, 128, 0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: false },
            y: { 
              beginAtZero: true,
              grid: { color: 'rgba(255,255,255,0.1)' }
            }
          }
        }
      });
      
      requestsChart = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: [],
          datasets: [{
            label: '请求数',
            data: [],
            backgroundColor: '#60a5fa',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: false },
            y: { 
              beginAtZero: true,
              grid: { color: 'rgba(255,255,255,0.1)' }
            }
          }
        }
      });
    }
    
    // 刷新数据
    async function refreshData() {
      try {
        const [overviewRes, alertsRes, historyRes] = await Promise.all([
          fetch(`${API_BASE}/dashboard/overview`),
          fetch(`${API_BASE}/alerts`),
          fetch(`${API_BASE}/metrics/history?type=performance&limit=30`)
        ]);
        
        const overview = await overviewRes.json();
        const alerts = await alertsRes.json();
        const history = await historyRes.json();
        
        updateOverview(overview.data);
        updateAlerts(alerts.data);
        updateCharts(history.data);
        
      } catch (error) {
        console.error('刷新失败:', error);
      }
    }
    
    // 更新概览
    function updateOverview(data) {
      // 健康度
      const healthEl = document.getElementById('healthScore');
      healthEl.textContent = data.health.score;
      healthEl.className = 'health-score ' + data.health.status;
      
      document.getElementById('healthLabel').textContent = 
        data.health.status === 'healthy' ? '系统健康' :
        data.health.status === 'degraded' ? '性能下降' : '系统异常';
      
      // 状态指示器
      document.getElementById('statusDot').className = 'status-dot ' + data.health.status;
      document.getElementById('statusText').textContent = 
        data.health.status === 'healthy' ? '运行正常' :
        data.health.status === 'degraded' ? '性能下降' : '需要关注';
      
      // 指标
      document.getElementById('rps').textContent = data.traffic.rps;
      document.getElementById('avgResponse').textContent = data.performance.avgResponse;
      document.getElementById('p95Response').textContent = data.performance.p95Response;
      document.getElementById('successRate').textContent = data.traffic.successRate;
      document.getElementById('errorRate').textContent = data.errors.rate;
      
      if (data.resources) {
        document.getElementById('cpuUsage').textContent = data.resources.cpu;
        document.getElementById('memUsage').textContent = data.resources.memory;
      }
    }
    
    // 更新告警
    function updateAlerts(alerts) {
      const list = document.getElementById('alertList');
      
      if (alerts.length === 0) {
        list.innerHTML = '<div style="opacity: 0.5; text-align: center; padding: 40px;">暂无活跃告警</div>';
        return;
      }
      
      list.innerHTML = alerts.map(alert => `
        <div class="alert-item">
          <span class="alert-icon">${getAlertIcon(alert.level.name)}</span>
          <div class="alert-info">
            <div class="alert-title">${alert.title}</div>
            <div class="alert-message">${alert.message}</div>
          </div>
          <div class="alert-time">${formatTime(alert.createdAt)}</div>
        </div>
      `).join('');
    }
    
    function getAlertIcon(level) {
      return level === 'critical' ? '🔴' :
             level === 'error' ? '🟠' :
             level === 'warning' ? '🟡' : '🔵';
    }
    
    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
    
    // 更新图表
    function updateCharts(data) {
      const labels = data.map((_, i) => '').slice(-30);
      const responseTime = data.map(d => d.responseTime).slice(-30);
      const requests = data.map((_, i) => Math.floor(Math.random() * 50) + 10).slice(-30);
      
      responseChart.data.labels = labels;
      responseChart.data.datasets[0].data = responseTime;
      responseChart.update('none');
      
      requestsChart.data.labels = labels;
      requestsChart.data.datasets[0].data = requests;
      requestsChart.update('none');
    }
    
    // 启动
    initCharts();
    refreshData();
    setInterval(refreshData, 10000);
  </script>
</body>
</html>
